function renderModal(){if(!state.modal)return '';let title='',subtitle='',body='',submit='Xác nhận',buttonId='submit';switch(state.modal){case'renew':title='Gia hạn gói Business';subtitle='Giữ nguyên tổ chức, dữ liệu và quyền lợi. NEXA sẽ xác nhận yêu cầu gia hạn.';body=`<div class="callout" style="margin-bottom:18px">Gói đang sử dụng: <b>Business Plus</b> · Hiệu lực đến <b>30/11/2026</b></div><form id="modal-form"> <div class="field"><label for="f_period">Thời hạn muốn gia hạn</label><select id="f_period" name="period"><option value="12">12 tháng</option><option value="3">3 tháng</option><option value="1">1 tháng</option></select></div>${input('seats','Số ghế dự kiến','Ví dụ: 250','number','250')}<div class="field"><label for="f_note">Ghi chú (tùy chọn)</label><textarea id="f_note" name="note" placeholder="Nhu cầu bổ sung hoặc câu hỏi dành cho NEXA"></textarea></div></form><div class="callout">Đây là luồng yêu cầu gia hạn, chưa thực hiện thanh toán tự động. Bạn sẽ theo dõi được trạng thái sau khi gửi.</div>`;submit='Gửi yêu cầu gia hạn';break;case'activate':title='Kích hoạt Business';subtitle='Thiết lập gói và gửi lời mời đến người quản trị tổ chức.';body=`<form id="modal-form">${input('organization','Tên tổ chức','','text','Trường Hoa Sen')}<div class="twofields"><div class="field"><label for="f_plan">Gói dịch vụ</label><select name="plan" id="f_plan"><option>Business Plus</option><option>Business Core</option></select></div><div class="field"><label for="f_cycle">Chu kỳ</label><select name="cycle" id="f_cycle"><option>12 tháng</option><option>3 tháng</option><option>1 tháng</option></select></div></div><div class="twofields">${input('seats','Số ghế','', 'number','250')}${input('credits','AI credits','', 'number','5000')}</div>${input('admin','Email quản trị viên','', 'email','ngocanh@hoasen.edu.vn')}</form><div class="callout">Sau khi kích hoạt, NEXA gửi một liên kết nhận quyền. Người đại diện dùng tài khoản cá nhân hiện có hoặc tạo tài khoản miễn phí.</div>`;submit='Kích hoạt và tạo lời mời';break;case'invite':title='Mời thành viên';subtitle='Thêm người học hoặc người quản trị vào Trường FPT Polytechnic.';body=`<form id="modal-form">${input('email','Email người nhận','ten@donvi.edu.vn','email')}<div class="field"><label for="f_kind">Quyền trong tổ chức</label><select name="kind" id="f_kind"><option>Thành viên</option><option>Quản trị viên</option></select></div><div class="field"><label for="f_class">Gắn vào lớp (không bắt buộc)</label><select name="class" id="f_class"><option>Chưa gắn lớp</option><option>CNTT-K65</option><option>Thiết kế-K24</option></select></div></form><div class="callout">Người nhận sẽ dùng tài khoản NEXA của mình. Chỉ quản trị viên mới thấy Organization Console.</div>`;submit='Tạo lời mời';break;case'create-class':title='Tạo lớp học';subtitle='Tập trung vào tên lớp và người phụ trách. Có thể thêm học viên sau.';body=`<form id="modal-form">${input('class','Tên lớp / nhóm','Ví dụ: CNTT K65')}${input('code','Mã lớp','Ví dụ: CNTT-K65')}<div class="field"><label>Người phụ trách</label><select name="head"><option>Chưa phân công</option><option>Lê Quang Huy</option><option>Trần Minh Đức</option></select></div></form>`;submit='Tạo lớp';break;case'new-campaign':title='Tạo đợt đánh giá';subtitle='Lập lịch, chọn đề và lớp. Không bắt đầu đánh giá khi chưa kiểm định đề.';body=`<form id="modal-form">${input('name','Tên đợt đánh giá','Đánh giá năng lực số đầu kỳ')}<div class="field"><label>Đề sử dụng</label><select name="assess"><option>Đánh giá kỹ năng số đầu vào</option><option>Tình huống an toàn thông tin (bản nháp)</option></select></div><div class="field"><label>Giao cho lớp</label><select name="class"><option>CNTT-K65</option><option>Thiết kế-K24</option></select></div><div class="twofields">${input('start','Ngày mở','','date')}${input('end','Ngày đóng','','date')}</div></form>`;submit='Lưu bản nháp đợt';break;case'new-assessment':title='Tạo đề đánh giá';subtitle='Khởi đầu bằng một bản nháp. Phát hành sau khi đã kiểm định.';body=`<form id="modal-form">${input('title','Tên đề đánh giá','Ví dụ: Đánh giá kỹ năng số đầu vào')}<div class="twofields">${input('duration','Thời lượng (phút)','','number','45')}${input('pass','Điểm đạt (%)','','number','70')}</div><div class="field"><label>Mục tiêu đánh giá</label><textarea name="purpose" placeholder="Mô tả ngắn"></textarea></div></form>`;submit='Tạo bản nháp';break;case'grade':title='Duyệt bài đánh giá';subtitle='Prototype mô phỏng quy trình phê duyệt, không tự chấm điểm chính thức.';body=`<div class="callout"><b>Bài thực hành: Cộng tác trực tuyến</b><p>Học viên: Nguyễn Minh Châu</p><p>Minh chứng: Google Docs + tệp PDF</p></div><div class="field" style="margin-top:18px"><label>Nhận xét của giảng viên</label><textarea placeholder="Ghi nhận theo rubric…"></textarea></div><div class="twofields">${input('score','Điểm duyệt (trên 100)','','number','78')}<div class="field"><label>Trạng thái</label><select><option>Duyệt kết quả</option><option>Yêu cầu bổ sung</option></select></div></div>`;submit='Lưu đánh giá (demo)';break;case'import':title='Nhập danh sách thành viên';subtitle='Kiểm tra email và vai trò trước khi gửi lời mời.';body=`<div class="field"><label for="csv">Chọn tệp CSV</label><input id="csv" type="file" accept=".csv"/></div><div class="callout">Trường tối thiểu: email, ho_ten, vai_tro. Bản prototype chỉ minh họa giao diện, không gửi dữ liệu lên server.</div>`;submit='Xác nhận (demo)';break;default:title='Chi tiết thao tác';subtitle='Bản mô phỏng luồng giao diện.';body=`<div class="callout">Khi triển khai thật, thao tác này sẽ truy cập API theo quyền của người dùng và hiển thị trạng thái thành công/thất bại rõ ràng.</div>`;submit='Đã hiểu'}return `<div class="modal-backdrop" data-dismiss="1"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-header"><div><h2>${title}</h2><p>${subtitle}</p></div><button class="iconbtn" data-action="modal-close" aria-label="Đóng">${icon('x')}</button></div><div class="modal-body">${body}</div><div class="modal-footer"><button class="btn" data-action="modal-close">Hủy</button><button class="btn primary" data-action="modal-submit">${submit} ${icon('arrow')}</button></div></div></div>`}
function render(){document.getElementById('app').innerHTML=layout();document.title=`${pageTitle()} — NEXA SaaS 3.0`}
function toast(msg){let e=document.getElementById('toast');e.innerHTML=`<div class="toast">${icon('check')} &nbsp; ${esc(msg)}</div>`;clearTimeout(window.__tt);window.__tt=setTimeout(()=>{if(e)e.innerHTML=''},3600)}
function navigate(view,area){if(area)state.area=area;state.view=view;state.modal=null;state.profile=false;state.mobile=false;if(view==='members')state.tab='members';window.scrollTo({top:0,behavior:'instant'});render()}
document.addEventListener('click',e=>{let nav=e.target.closest('[data-nav]');if(nav){navigate(nav.dataset.nav);return}let ar=e.target.closest('[data-area]');if(ar){navigate(ar.dataset.area==='org'?'overview':ar.dataset.area==='admin'?'requests':'tasks',ar.dataset.area);return}let tab=e.target.closest('[data-tab]');if(tab){state.tab=tab.dataset.tab;render();return}let act=e.target.closest('[data-action]');if(!act){if(e.target.matches('[data-dismiss]')){state.modal=null;render()}return}const a=act.dataset.action;if(a==='profile'){state.profile=!state.profile;render();return}if(a==='mobile'){state.mobile=!state.mobile;render();return}if(a==='close-mobile'){state.mobile=false;render();return}if(a==='modal-close'){state.modal=null;render();return}if(a==='modal-submit'){if(state.modal==='renew'){state.renewal=true;state.modal=null;render();toast('Đã tạo yêu cầu gia hạn. NEXA sẽ xác nhận và cập nhật kỳ sử dụng.');return}if(state.modal==='activate'){state.businessRequest='ACTIVATED';state.modal=null;render();toast('Đã kích hoạt Business (minh họa) và tạo lời mời quản trị.');return}let msg=({'invite':'Đã tạo lời mời minh họa','new-assessment':'Đã tạo đề nháp minh họa','new-campaign':'Đã lưu đợt đánh giá nháp minh họa','create-class':'Đã tạo lớp minh họa','grade':'Đã lưu đánh giá minh họa','import':'Đã tiếp nhận tệp minh họa'})[state.modal]||'Đã tiếp nhận thao tác (prototype)';state.modal=null;render();toast(msg);return}if(a==='renew'){if(state.renewal){toast('Yêu cầu gia hạn đang chờ NEXA xác nhận.');return}state.modal='renew';render();return}if(a==='notification'){toast('Không có thông báo mới trong bản prototype.');return}if(a==='switch'){act.classList.toggle('on');toast('Đã đổi trạng thái giao diện minh họa.');return}if(a==='resend'){toast('Đã ghi nhận thao tác gửi lại lời mời (demo).');return}if(a==='export'){toast('Bản prototype chưa xuất dữ liệu thực.');return}if(a==='settings-save'){toast('Thông tin cập nhật cần được NEXA xác nhận.');return}if(a==='admin-info'){toast('Vui lòng liên hệ bộ phận hỗ trợ NEXA để kích hoạt gói.');return}if(['activate','invite','import','create-class','new-campaign','new-assessment','grade'].includes(a)){state.modal=a;render();return}state.modal='general';render()});
document.addEventListener('input',e=>{if(e.target.matches('[data-filter]')){state.filter=e.target.value;let pos=e.target.selectionStart;render();let el=document.querySelector('[data-filter]');if(el){el.focus();el.setSelectionRange(pos,pos)}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(state.modal||state.profile||state.mobile)){state.modal=null;state.profile=false;state.mobile=false;render()}});
render();
</script></body></html>
