<svg width="220" height="60" viewBox="0 0 220 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- NEXA Razor Nexus N Mark (Scaled 42x42 at x=10, y=9) -->
  <g transform="translate(10, 9) scale(0.42)">
    <!-- Dual Pillars (Pure White #FFFFFF) -->
    <rect x="18" y="18" width="16" height="64" rx="2" fill="#FFFFFF" />
    <rect x="66" y="18" width="16" height="64" rx="2" fill="#FFFFFF" />
    <!-- Dynamic Diagonal Beam (Electric Blue #60A5FA) -->
    <polygon points="34,18 50,18 66,82 50,82" fill="#60A5FA" />
  </g>

  <!-- Typography NEXA (Optically centered to mark center y=30) -->
  <text x="64" y="39" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" letter-spacing="0.16em" fill="#FFFFFF">NEXA<tspan fill="#60A5FA">.</tspan></text>
</svg>
